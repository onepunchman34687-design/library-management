<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .sidebar {
      min-height: 100vh;
      background: #1a1a2e;
      padding-top: 20px;
    }
    .sidebar .nav-link {
      color: #adb5bd;
      padding: 10px 20px;
      border-radius: 8px;
      margin: 2px 10px;
    }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      background: #16213e;
      color: #fff;
    }
    .sidebar .brand {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 10px 20px 30px;
    }
    .main-content { padding: 30px; }
    .stat-card {
      border-radius: 12px;
      border: none;
      padding: 20px;
      color: white;
    }
    .table { background: white; border-radius: 12px; overflow: hidden; }
    .badge-available { background: #d1fae5; color: #065f46; }
    .badge-unavailable { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
<div class="d-flex">
  <div class="sidebar col-md-2">
    <div class="brand"><i class="bi bi-book-half me-2"></i>LibraryMS</div>
    <nav class="nav flex-column">
      <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
        <i class="bi bi-speedometer2 me-2"></i>Dashboard
      </a>
      <a class="nav-link {% if 'books' in request.endpoint %}active{% endif %}" href="{{ url_for('books.list_books') }}">
        <i class="bi bi-books me-2"></i>Books
      </a>
      <a class="nav-link {% if 'members' in request.endpoint %}active{% endif %}" href="{{ url_for('members.list_members') }}">
        <i class="bi bi-people me-2"></i>Members
      </a>
      <a class="nav-link {% if 'transactions' in request.endpoint %}active{% endif %}" href="{{ url_for('transactions.list_transactions') }}">
        <i class="bi bi-arrow-left-right me-2"></i>Transactions
      </a>
    </nav>
  </div>

  <div class="col-md-10 main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
