{% extends 'base.html' %}
{% block content %}
<h4 class="mb-4">Dashboard</h4>
<div class="row g-4 mb-4">
  <div class="col-md-3">
    <div class="stat-card" style="background:#4f46e5">
      <div style="font-size:2rem;font-weight:700">{{ total_books }}</div>
      <div>Total Books</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="stat-card" style="background:#0891b2">
      <div style="font-size:2rem;font-weight:700">{{ total_members }}</div>
      <div>Total Members</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="stat-card" style="background:#16a34a">
      <div style="font-size:2rem;font-weight:700">{{ active_borrows }}</div>
      <div>Active Borrows</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="stat-card" style="background:#dc2626">
      <div style="font-size:2rem;font-weight:700">{{ overdue }}</div>
      <div>Overdue</div>
    </div>
  </div>
</div>
{% endblock %}
