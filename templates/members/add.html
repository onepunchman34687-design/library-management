{% extends 'base.html' %}
{% block content %}
<div class="col-md-6">
  <h4 class="mb-4">{{ 'Edit' if member else 'Add New' }} Member</h4>
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-control" name="name" value="{{ member.name if member else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email *</label>
          <input type="email" class="form-control" name="email" value="{{ member.email if member else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" name="phone" value="{{ member.phone if member else '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Address</label>
          <textarea class="form-control" name="address" rows="2">{{ member.address if member else '' }}</textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save Member</button>
          <a href="{{ url_for('members.list_members') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
